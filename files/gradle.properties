## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7042
APP_VERSION_NAME=12.10.1
APP_PACKAGE=com.xtreegram.messenger
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=SET_BY_REBRAND_SCRIPT
RELEASE_KEY_ALIAS=SET_BY_REBRAND_SCRIPT
RELEASE_STORE_PASSWORD=SET_BY_REBRAND_SCRIPT
# -Xmx8g на 16-ГБ раннере — это смерть: R8 держит половину кучи off-heap, и в
# пике ядро убивает демона («daemon disappeared unexpectedly»). 6 ГБ хватает с
# запасом, остальное добирает своп (см. шаг Add swap в workflow).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=true
# Параллельные задачи складывают пики памяти: R8 и dex-десугаринг одновременно
# не влезают. Пусть идут по очереди — сборка длиннее на минуты, но не падает.
org.gradle.parallel=false
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
